services:
  - type: web
    name: kana-notes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATA_DIR
        value: ./data
      - key: SEND_MODE
        value: test
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: TEST_RECIPIENT_EMAIL
        sync: false
      - key: TELEGRAM_REPORT_EMAIL
        sync: false
      - key: WHATSAPP_REPORT_EMAIL
        sync: false
      - key: GMAIL_EXTRA_ACCOUNTS_JSON
        value: '[]'
